name: Publish Android update
on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: read
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: write
    steps:
      - name: Check out Android source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MachoDrone/gridlens-android
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.1
      - name: Select unpublished version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/publish-release.ts select
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        if: steps.version.outputs.needed == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Android build tools
        if: steps.version.outputs.needed == 'true'
        run: |
          sdk_dir="$RUNNER_TEMP/gridlens-android-sdk"
          cli_archive="$RUNNER_TEMP/gridlens-commandlinetools.zip"
          mkdir -p "$sdk_dir/cmdline-tools" "$sdk_dir/bootstrap"
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 30 --max-time 300 \
            'https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip' \
            --output "$cli_archive"
          test "$(stat --format=%s "$cli_archive")" = '181052239'
          # Size and SHA-1 are pinned from Google's repository2-1.xml archive record.
          printf 'e025545c62a8e64c7559119566a569fb1dec5f60  %s\n' "$cli_archive" | sha1sum --check --status
          unzip -q "$cli_archive" -d "$sdk_dir/bootstrap"
          mv "$sdk_dir/bootstrap/cmdline-tools" "$sdk_dir/cmdline-tools/latest"
          rmdir "$sdk_dir/bootstrap"
          rm "$cli_archive"
          export ANDROID_HOME="$sdk_dir"
          export ANDROID_SDK_ROOT="$sdk_dir"
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$sdk_dir" "$sdk_dir" >> "$GITHUB_ENV"
          printf '%s\n' "$sdk_dir/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          # Use an absolute path: hosted runner images do not guarantee sdkmanager on PATH.
          # Bounded input also avoids a yes|sdkmanager SIGPIPE failure under bash pipefail.
          python3 - <<'PY'
          import os
          import subprocess
          root = os.environ['ANDROID_HOME']
          manager = os.path.join(root, 'cmdline-tools', 'latest', 'bin', 'sdkmanager')
          subprocess.run([manager, '--sdk_root=' + root, '--licenses'], input='y\n' * 100,
                         text=True, check=True)
          subprocess.run([manager, '--sdk_root=' + root, 'platforms;android-35',
                          'build-tools;35.0.0', 'ndk;27.3.13750724', 'cmake;3.22.1'],
                         input='y\n' * 100, text=True, check=True)
          PY
          test -f "$sdk_dir/platforms/android-35/android.jar"
          test -x "$sdk_dir/build-tools/35.0.0/apksigner"
          test -x "$sdk_dir/build-tools/35.0.0/zipalign"
          test -f "$sdk_dir/ndk/27.3.13750724/source.properties"
          test -x "$sdk_dir/cmake/3.22.1/bin/cmake"
      - name: Install dependencies
        if: steps.version.outputs.needed == 'true'
        run: |
          npm install --global npm@11.11.0
          npm ci --ignore-scripts
          npm run deps:vendor
          cd vendor/gridlens
          npx --no-install playwright install --with-deps chromium
      - name: Verify application
        if: steps.version.outputs.needed == 'true'
        run: npm run check
      - name: Prepare verified Android runtime
        if: steps.version.outputs.needed == 'true'
        run: node tools/prepare-native.ts
      - name: Build and sign
        if: steps.version.outputs.needed == 'true'
        env:
          GRIDLENS_KEYSTORE_BASE64: ${{ secrets.GRIDLENS_KEYSTORE_BASE64 }}
          GRIDLENS_KEYSTORE_PASSWORD: ${{ secrets.GRIDLENS_KEYSTORE_PASSWORD }}
          GRIDLENS_KEY_ALIAS: ${{ secrets.GRIDLENS_KEY_ALIAS }}
          GRIDLENS_KEY_PASSWORD: ${{ secrets.GRIDLENS_KEY_PASSWORD }}
        run: |
          umask 077
          export GRIDLENS_KEYSTORE="$RUNNER_TEMP/gridlens-android.p12"
          trap 'rm -f "$GRIDLENS_KEYSTORE"' EXIT
          printf '%s' "$GRIDLENS_KEYSTORE_BASE64" | base64 --decode > "$GRIDLENS_KEYSTORE"
          test -s "$GRIDLENS_KEYSTORE"
          cd android
          ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease
      - name: Verify APK and publish release
        if: steps.version.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/gridlens-android.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs release/gridlens-android.apk > release/apk-signature.txt
          expected_certificate="$(cat licenses/release-certificate-sha256.txt)"
          rg --fixed-strings --line-regexp "Signer #1 certificate SHA-256 digest: $expected_certificate" release/apk-signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 release/gridlens-android.apk
          node tools/release-manifest.ts release/gridlens-android.apk release/update.json
          (cd release && sha256sum gridlens-android.apk > SHA256SUMS.txt)
          source_commit="$(git rev-parse HEAD)"
          printf '<!-- gridlens-android-release -->\nGridLens Android %s\n\nSource: https://github.com/MachoDrone/gridlens-android/commit/%s\n\nBuilt from the bundled Fleet UI and on-phone Node runtime. Desktop remains independent. Automated application checks, Android unit tests, lint, APK signature and alignment checks passed. Physical-device acceptance is separate; see source documentation.\n' "$RELEASE_TAG" "$source_commit" > release/notes.md
          node tools/publish-release.ts publish release
