name: Publish Android update
on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: read
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: write
    steps:
      - name: Check out Android source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MachoDrone/gridlens-android
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.1
      - name: Select unpublished version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/publish-release.ts select
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        if: steps.version.outputs.needed == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        if: steps.version.outputs.needed == 'true'
        run: |
          npm install --global npm@11.11.0
          npm ci --ignore-scripts
          npm run deps:vendor
          cd vendor/gridlens
          npx --no-install playwright install --with-deps chromium
      - name: Verify application
        if: steps.version.outputs.needed == 'true'
        run: npm run check
      - name: Prepare verified Android runtime
        if: steps.version.outputs.needed == 'true'
        run: |
          node tools/prepare-native.ts
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.3.13750724' 'cmake;3.22.1'
      - name: Build and sign
        if: steps.version.outputs.needed == 'true'
        env:
          GRIDLENS_KEYSTORE_BASE64: ${{ secrets.GRIDLENS_KEYSTORE_BASE64 }}
          GRIDLENS_KEYSTORE_PASSWORD: ${{ secrets.GRIDLENS_KEYSTORE_PASSWORD }}
          GRIDLENS_KEY_ALIAS: ${{ secrets.GRIDLENS_KEY_ALIAS }}
          GRIDLENS_KEY_PASSWORD: ${{ secrets.GRIDLENS_KEY_PASSWORD }}
        run: |
          umask 077
          export GRIDLENS_KEYSTORE="$RUNNER_TEMP/gridlens-android.p12"
          trap 'rm -f "$GRIDLENS_KEYSTORE"' EXIT
          printf '%s' "$GRIDLENS_KEYSTORE_BASE64" | base64 --decode > "$GRIDLENS_KEYSTORE"
          test -s "$GRIDLENS_KEYSTORE"
          cd android
          ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease
      - name: Verify APK and publish release
        if: steps.version.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/gridlens-android.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs release/gridlens-android.apk > release/apk-signature.txt
          expected_certificate="$(cat licenses/release-certificate-sha256.txt)"
          rg --fixed-strings --line-regexp "Signer #1 certificate SHA-256 digest: $expected_certificate" release/apk-signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 release/gridlens-android.apk
          node tools/release-manifest.ts release/gridlens-android.apk release/update.json
          (cd release && sha256sum gridlens-android.apk > SHA256SUMS.txt)
          source_commit="$(git rev-parse HEAD)"
          printf '<!-- gridlens-android-release -->\nGridLens Android %s\n\nSource: https://github.com/MachoDrone/gridlens-android/commit/%s\n\nBuilt from the bundled Fleet UI and on-phone Node runtime. Desktop remains independent. Automated application checks, Android unit tests, lint, APK signature and alignment checks passed. Physical-device acceptance is separate; see source documentation.\n' "$RELEASE_TAG" "$source_commit" > release/notes.md
          node tools/publish-release.ts publish release
