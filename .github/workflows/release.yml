name: Publish Android update
on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: read
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: write
    steps:
      - name: Check out Android source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MachoDrone/gridlens-android
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.1
      - name: Check release tool availability
        run: |
          for tool in git gh curl unzip sha1sum sha256sum stat python3; do
            if ! command -v "$tool" >/dev/null; then
              printf 'Missing required release tool: %s. No build or publication was started.\n' "$tool" >&2
              exit 1
            fi
          done
      - name: Select unpublished version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/publish-release.ts select
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        if: steps.version.outputs.needed == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Android build tools
        if: steps.version.outputs.needed == 'true'
        run: |
          sdk_dir="$RUNNER_TEMP/gridlens-android-sdk"
          cli_archive="$RUNNER_TEMP/gridlens-commandlinetools.zip"
          mkdir -p "$sdk_dir/cmdline-tools" "$sdk_dir/bootstrap"
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 30 --max-time 300 \
            'https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip' \
            --output "$cli_archive"
          test "$(stat --format=%s "$cli_archive")" = '181052239'
          # Size and SHA-1 are pinned from Google's repository2-1.xml archive record.
          printf 'e025545c62a8e64c7559119566a569fb1dec5f60  %s\n' "$cli_archive" | sha1sum --check --status
          unzip -q "$cli_archive" -d "$sdk_dir/bootstrap"
          mv "$sdk_dir/bootstrap/cmdline-tools" "$sdk_dir/cmdline-tools/latest"
          rmdir "$sdk_dir/bootstrap"
          rm "$cli_archive"
          export ANDROID_HOME="$sdk_dir"
          export ANDROID_SDK_ROOT="$sdk_dir"
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$sdk_dir" "$sdk_dir" >> "$GITHUB_ENV"
          printf '%s\n' "$sdk_dir/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          # Use an absolute path: hosted runner images do not guarantee sdkmanager on PATH.
          # Bounded input also avoids a yes|sdkmanager SIGPIPE failure under bash pipefail.
          python3 - <<'PY'
          import os
          import subprocess
          root = os.environ['ANDROID_HOME']
          manager = os.path.join(root, 'cmdline-tools', 'latest', 'bin', 'sdkmanager')
          subprocess.run([manager, '--sdk_root=' + root, '--licenses'], input='y\n' * 100,
                         text=True, check=True)
          subprocess.run([manager, '--sdk_root=' + root, 'platforms;android-35',
                          'build-tools;35.0.0', 'ndk;27.3.13750724', 'cmake;3.22.1'],
                         input='y\n' * 100, text=True, check=True)
          PY
          test -f "$sdk_dir/platforms/android-35/android.jar"
          test -x "$sdk_dir/build-tools/35.0.0/apksigner"
          test -x "$sdk_dir/build-tools/35.0.0/zipalign"
          test -f "$sdk_dir/ndk/27.3.13750724/source.properties"
          test -x "$sdk_dir/cmake/3.22.1/bin/cmake"
      - name: Install dependencies
        if: steps.version.outputs.needed == 'true'
        run: |
          npm install --global npm@11.11.0
          npm ci --ignore-scripts
          npm run deps:vendor
          cd vendor/gridlens
          npx --no-install playwright install --with-deps chromium
      - name: Verify application
        if: steps.version.outputs.needed == 'true'
        run: |
          node --input-type=module <<'JS'
          import { execFileSync, spawnSync } from 'node:child_process';
          const repository = 'MachoDrone/gridlens-android';
          const sha = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          if (!/^[a-f0-9]{40}$/.test(sha)) throw Error('Invalid source revision');
          let trustedRun;
          try {
            const query = new URLSearchParams({ branch: 'main', event: 'push', head_sha: sha, per_page: '10' });
            const response = await fetch(`https://api.github.com/repos/${repository}/actions/workflows/check.yml/runs?${query}`, {
              redirect: 'error', signal: AbortSignal.timeout(20000),
              headers: { Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'GridLens-Android-Release' },
            });
            if (!response.ok || !response.body) throw Error(`Source CI lookup returned HTTP ${response.status}`);
            const chunks = [];
            let size = 0;
            for await (const chunk of response.body) {
              size += chunk.length;
              if (size > 1024 * 1024) throw Error('Source CI response exceeded its bound');
              chunks.push(Buffer.from(chunk));
            }
            const data = JSON.parse(Buffer.concat(chunks).toString('utf8'));
            if (!Array.isArray(data.workflow_runs)) throw Error('Source CI returned invalid metadata');
            // GitHub returns newest runs first. Never select an older success over a newer failure.
            const newest = data.workflow_runs.find(run => run.head_sha === sha && run.head_branch === 'main'
              && run.event === 'push' && run.path === '.github/workflows/check.yml'
              && run.repository?.full_name === repository && run.head_repository?.full_name === repository);
            if (newest?.status === 'completed' && newest.conclusion === 'success' && Number.isSafeInteger(newest.id)) trustedRun = newest;
          } catch {
            console.log('Exact successful source CI could not be verified; running all application checks locally.');
          }
          if (trustedRun) console.log(`Reusing successful source CI run ${trustedRun.id} for exact revision ${sha}; building the checked application assets.`);
          else console.log(`Running the complete application checks for ${sha}.`);
          const result = spawnSync('npm', ['run', trustedRun ? 'build' : 'check'], { stdio: 'inherit', shell: false });
          if (result.error) throw result.error;
          if (result.status !== 0) process.exit(result.status ?? 1);
          JS
      - name: Prepare verified Android runtime
        if: steps.version.outputs.needed == 'true'
        run: node tools/prepare-native.ts
      - name: Build and sign
        if: steps.version.outputs.needed == 'true'
        env:
          GRIDLENS_KEYSTORE_BASE64: ${{ secrets.GRIDLENS_KEYSTORE_BASE64 }}
          GRIDLENS_KEYSTORE_PASSWORD: ${{ secrets.GRIDLENS_KEYSTORE_PASSWORD }}
          GRIDLENS_KEY_ALIAS: ${{ secrets.GRIDLENS_KEY_ALIAS }}
          GRIDLENS_KEY_PASSWORD: ${{ secrets.GRIDLENS_KEY_PASSWORD }}
        run: |
          umask 077
          export GRIDLENS_KEYSTORE="$RUNNER_TEMP/gridlens-android.p12"
          trap 'rm -f "$GRIDLENS_KEYSTORE"' EXIT
          printf '%s' "$GRIDLENS_KEYSTORE_BASE64" | base64 --decode > "$GRIDLENS_KEYSTORE"
          test -s "$GRIDLENS_KEYSTORE"
          cd android
          ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease
      - name: Verify APK and publish release
        if: steps.version.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/gridlens-android.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs release/gridlens-android.apk > release/apk-signature.txt
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const expected = readFileSync('licenses/release-certificate-sha256.txt', 'utf8').trim();
          if (!/^[a-f0-9]{64}$/.test(expected)) throw Error('Invalid pinned Android signing certificate');
          const lines = readFileSync('release/apk-signature.txt', 'utf8').split(/\r?\n/);
          if (!lines.includes(`Signer #1 certificate SHA-256 digest: ${expected}`)) throw Error('APK signing certificate does not match the pinned release identity');
          console.log('Verified the pinned Android signing certificate.');
          JS
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 release/gridlens-android.apk
          node tools/release-manifest.ts release/gridlens-android.apk release/update.json
          (cd release && sha256sum gridlens-android.apk > SHA256SUMS.txt)
          source_commit="$(git rev-parse HEAD)"
          printf '<!-- gridlens-android-release -->\nGridLens Android %s\n\nSource: https://github.com/MachoDrone/gridlens-android/commit/%s\n\nBuilt from the bundled Fleet UI and on-phone Node runtime. Desktop remains independent. Automated application checks, Android unit tests, lint, APK signature and alignment checks passed. Physical-device acceptance is separate; see source documentation.\n' "$RELEASE_TAG" "$source_commit" > release/notes.md
          node tools/publish-release.ts publish release
